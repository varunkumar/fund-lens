<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fund Lens Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../ui/styles.css">
</head>
<body class="dashboard">
  <header class="brand"><img src="../../icons/icon-48.png" alt="" width="36" height="36"><h1>Fund Lens</h1></header>

  </div>
  <div id="charts"></div>
  <div id="root"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
