<!doctype html>
<meta charset="utf-8">
<title>Store frame</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: linear-gradient(135deg, #0b2a6f, #0f766e); font: 600 28px system-ui, sans-serif; color: #fff; }
  .wrap { display: flex; align-items: center; gap: 56px; }
  iframe { width: 512px; height: 640px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  p { max-width: 380px; line-height: 1.3; margin: 0; }
  small { display: block; margin-top: 12px; font-weight: 400; font-size: 18px; opacity: .85; }
</style>
<div class="wrap">
  <p>All your mutual funds in one view.<small>Sync from myCAMS or KFintech. Data never leaves your browser.</small></p>
  <iframe src="harness.html?page=popup&theme=light"></iframe>
</div>
